<!-- RSS feed autodiscovery -->
<link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ config.base_url }}/rss.xml" />

<!-- Twitter Card meta tags -->
<meta name="twitter:card" content="summary_large_image" />
{%- if page.title %}
<meta name="twitter:title" content="{{ page.title }}" />
{%- elif section is defined and section.title %}
<meta name="twitter:title" content="{{ section.title }}" />
{%- else %}
<meta name="twitter:title" content="{{ config.title }}" />
{%- endif %}
{%- if page.description %}
<meta name="twitter:description" content="{{ page.description | truncate(length=200) }}" />
{%- elif section is defined and section.description %}
<meta name="twitter:description" content="{{ section.description | truncate(length=200) }}" />
{%- elif config.description %}
<meta name="twitter:description" content="{{ config.description | truncate(length=200) }}" />
{%- endif %}

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ config.title }}",
  "description": "{{ config.description | safe }}",
  "url": "{{ config.base_url }}",
  "author": {
    "@type": "Person",
    "name": "Sarah Deaton",
    "jobTitle": "Technical Content Engineer",
    "worksFor": {
      "@type": "Organization",
      "name": "Anthropic"
    },
    "sameAs": [
      "https://www.linkedin.com/in/sarahstringerdeaton/"
    ]
  }
}
</script>
{%- if page.title and page.date %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title }}",
  "description": "{{ page.description | default(value='') }}",
  "datePublished": "{{ page.date | date(format='%Y-%m-%d') }}",
  {%- if page.updated %}
  "dateModified": "{{ page.updated | date(format='%Y-%m-%d') }}",
  {%- endif %}
  "author": {
    "@type": "Person",
    "name": "Sarah Deaton"
  },
  "publisher": {
    "@type": "Person",
    "name": "Sarah Deaton"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.permalink }}"
  }
}
</script>
{%- endif %}

<!-- Site fonts: Bricolage Grotesque (display), Instrument Serif (titles), DM Mono (body/labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300..500;1,300..500&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..600&display=swap" rel="stylesheet">

<!-- Site design -->
<link rel="stylesheet" href="{{ get_url(path='css/site.css') }}">

<style>
/* Hide reading time estimates and the separator before it */
time[datetime^="PT"] {
  display: none !important;
}
span.middot:has(+ time[datetime^="PT"]) {
  display: none !important;
}

/* Show and style post descriptions as subtitles */
.post-description,
article header .description,
header .page-description {
  display: block !important;
  font-size: 1.2em;
  font-style: italic;
  color: #666;
  margin-top: 0.5em;
  margin-bottom: 1em;
}
:root.dark .post-description,
:root.dark article header .description,
:root.dark header .page-description {
  color: #a1a1aa;
}

/* Allow descriptions to wrap on listing page instead of truncating */
section.block-bg .truncate {
  overflow: visible !important;
  text-overflow: unset !important;
  white-space: normal !important;
}

/* Remove decorative backticks from inline code */
code::before,
code::after {
  content: "" !important;
}

/* Remove decorative quotes from blockquotes */
blockquote::before,
blockquote::after,
blockquote p::before,
blockquote p::after {
  content: "" !important;
}

/* Clickable header links */
.header-anchor {
  opacity: 0;
  margin-left: 0.5em;
  font-size: 0.8em;
  text-decoration: none;
  color: var(--ink-3);
  transition: opacity 0.2s;
}

h1:hover .header-anchor,
h2:hover .header-anchor,
h3:hover .header-anchor,
h4:hover .header-anchor,
h5:hover .header-anchor,
h6:hover .header-anchor {
  opacity: 1;
}

.header-anchor:hover {
  color: var(--ink);
}

/* Click-to-zoom for content images */
article img,
main img,
.content img {
  cursor: zoom-in;
}

.image-zoom-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  cursor: zoom-out;
  opacity: 0;
  transition: opacity 0.2s;
  padding: 2rem;
}

.image-zoom-overlay.active {
  opacity: 1;
}

.image-zoom-overlay img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

/* Copy button for code blocks */
pre {
  position: relative;
}

.code-copy-btn {
  position: absolute;
  top: 0.5em;
  right: 0.5em;
  padding: 0.25em 0.6em;
  font-size: 0.7em;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-family: var(--mono);
  background: var(--panel);
  color: var(--ink);
  border: 1.5px solid var(--ink);
  border-radius: 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
  z-index: 1;
}
:root.dark .code-copy-btn {
  background: rgba(255, 255, 255, 0.1);
  color: #ddd;
  border-color: rgba(255, 255, 255, 0.25);
}

pre:hover .code-copy-btn,
.code-copy-btn:focus {
  opacity: 1;
}

.code-copy-btn:hover {
  background: rgba(0, 0, 0, 0.15);
}
:root.dark .code-copy-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.code-copy-btn.copied {
  opacity: 1;
  background: rgba(100, 200, 100, 0.3);
  color: #1a4d1a;
}
:root.dark .code-copy-btn.copied {
  color: #fff;
}

/* Expandable code blocks - show first ~280px with fade, button to reveal rest */
.expandable-code {
  position: relative;
  max-height: 280px;
  overflow: hidden;
  margin-bottom: 0;
  transition: max-height 0.25s ease-out;
}

.expandable-code.expanded {
  max-height: 6000px;
}

.expandable-code::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: linear-gradient(to bottom, transparent, var(--expandable-fade, #f5f5f5));
  pointer-events: none;
  transition: opacity 0.2s;
}

:root.dark .expandable-code::after {
  background: linear-gradient(to bottom, transparent, var(--expandable-fade, #1e1e1e));
}

.expandable-code.expanded::after {
  opacity: 0;
}

.expandable-code-toggle {
  display: block;
  margin: 0.6rem auto 1.5rem;
  padding: 0.4em 1.2em;
  font-size: 0.8em;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-family: var(--mono);
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 0;
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  transition: background 0.2s;
}

:root.dark .expandable-code-toggle {
  background: rgba(255, 255, 255, 0.1);
  color: #ddd;
  border-color: rgba(255, 255, 255, 0.25);
}

.expandable-code-toggle:hover {
  background: rgba(0, 0, 0, 0.15);
}
:root.dark .expandable-code-toggle:hover {
  background: rgba(255, 255, 255, 0.2);
}
</style>

<script>
// Add clickable anchor links to all headers
document.addEventListener('DOMContentLoaded', function() {
  const headers = document.querySelectorAll('h2[id], h3[id], h4[id], h5[id], h6[id]');

  headers.forEach(header => {
    const id = header.getAttribute('id');
    if (!id) return;

    const anchor = document.createElement('a');
    anchor.className = 'header-anchor';
    anchor.href = `#${id}`;
    anchor.innerHTML = '#';
    anchor.title = 'Copy link to clipboard';

    // Click to copy link to clipboard and update URL
    anchor.addEventListener('click', function(e) {
      e.preventDefault();
      const url = window.location.origin + window.location.pathname + `#${id}`;

      // Update the URL bar
      window.history.pushState(null, '', `#${id}`);

      // Copy to clipboard
      navigator.clipboard.writeText(url).then(() => {
        // Visual feedback
        const originalText = anchor.innerHTML;
        anchor.innerHTML = '✓';
        setTimeout(() => {
          anchor.innerHTML = originalText;
        }, 1000);
      });
    });

    header.appendChild(anchor);
  });
});

// Click-to-zoom for content images
document.addEventListener('DOMContentLoaded', function() {
  const images = document.querySelectorAll('article img, main img, .content img');

  images.forEach(img => {
    if (img.closest('a')) return;

    img.addEventListener('click', function() {
      const overlay = document.createElement('div');
      overlay.className = 'image-zoom-overlay';

      const zoomed = document.createElement('img');
      zoomed.src = img.currentSrc || img.src;
      zoomed.alt = img.alt || '';

      overlay.appendChild(zoomed);
      document.body.appendChild(overlay);

      requestAnimationFrame(() => overlay.classList.add('active'));

      const close = () => {
        overlay.classList.remove('active');
        setTimeout(() => overlay.remove(), 200);
        document.removeEventListener('keydown', escHandler);
      };

      const escHandler = (e) => {
        if (e.key === 'Escape') close();
      };

      overlay.addEventListener('click', close);
      document.addEventListener('keydown', escHandler);
    });
  });
});

// Copy button for code blocks
document.addEventListener('DOMContentLoaded', function() {
  const blocks = document.querySelectorAll('pre');

  blocks.forEach(pre => {
    if (pre.querySelector('.code-copy-btn')) return;
    const code = pre.querySelector('code');
    if (!code) return;

    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy code to clipboard');

    btn.addEventListener('click', function() {
      navigator.clipboard.writeText(code.textContent).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1500);
      }).catch(() => {
        btn.textContent = 'Error';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      });
    });

    pre.appendChild(btn);
  });
});

// Expandable code blocks — wraps long snippets behind a "Show more" button
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.expandable-code').forEach(wrapper => {
    if (wrapper.dataset.expandableInit) return;
    wrapper.dataset.expandableInit = '1';

    // Match the fade gradient to the actual code block background color
    const pre = wrapper.querySelector('pre');
    if (pre) {
      const bg = getComputedStyle(pre).backgroundColor;
      if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
        wrapper.style.setProperty('--expandable-fade', bg);
      }
    }

    // Skip the toggle if the content already fits inside the collapsed max-height
    if (wrapper.scrollHeight <= wrapper.clientHeight + 10) return;

    const btn = document.createElement('button');
    btn.className = 'expandable-code-toggle';
    btn.type = 'button';
    btn.textContent = 'Show more';

    btn.addEventListener('click', function() {
      const isExpanded = wrapper.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'Show less' : 'Show more';
    });

    wrapper.after(btn);
  });
});
</script>

<!-- TOC: highlight the section you're reading, and follow clicks immediately -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const toc = document.querySelector('.fm-toc');
  if (!toc) return;

  // Pair each TOC link with its heading, in document order.
  const entries = [];
  toc.querySelectorAll('a[href^="#"]').forEach(function(link) {
    let heading = null;
    try { heading = document.getElementById(decodeURIComponent(link.hash.slice(1))); } catch (e) {}
    if (heading) entries.push({ link: link, heading: heading });
  });
  if (!entries.length) return;

  entries.sort(function(a, b) {
    return a.heading.compareDocumentPosition(b.heading) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
  });

  let current = null;
  function setCurrent(link) {
    if (link === current) return;
    if (current) current.classList.remove('is-current');
    if (link) link.classList.add('is-current');
    current = link;
  }

  // A click wins until the jump settles, so the mark lands where you clicked.
  let holdUntil = 0;
  entries.forEach(function(entry) {
    entry.link.addEventListener('click', function() {
      setCurrent(entry.link);
      holdUntil = Date.now() + 700;
    });
  });

  // The heading whose top has passed the reading line is the one you're in.
  const READING_LINE = 120;
  function update() {
    if (Date.now() < holdUntil) return;
    let found = null;
    for (let i = 0; i < entries.length; i++) {
      if (entries[i].heading.getBoundingClientRect().top <= READING_LINE) found = entries[i].link;
      else break;
    }
    setCurrent(found);
  }

  // Timestamp throttle with a trailing call. A requestAnimationFrame gate would
  // wedge shut if the frame callback never fired, freezing the mark in place.
  let lastRun = 0;
  let trailing = null;
  const INTERVAL = 80;
  function onScroll() {
    const now = Date.now();
    clearTimeout(trailing);
    if (now - lastRun >= INTERVAL) {
      lastRun = now;
      update();
    } else {
      trailing = setTimeout(function() { lastRun = Date.now(); update(); }, INTERVAL);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
});
</script>
